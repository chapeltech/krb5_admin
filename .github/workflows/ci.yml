name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            debian:trixie-slim /bin/sh -euxc '
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                build-essential heimdal-dev \
                libdbd-sqlite3-perl libdbi-perl perl swig
              cp -a /src /tmp/krb5_admin
              cd /tmp/krb5_admin
              KRB5TYPE=heimdal KRB5DIR=/usr perl Makefile.PL
              cd Krb5Admin
              KRB5TYPE=heimdal KRB5DIR=/usr \
                KRB5INCDIR=/usr/include/heimdal \
                KRB5LIBDIR=/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/heimdal \
                perl Makefile.PL
              cd ..
              make -j1
              sed "s/__HOSTNAME__/$(hostname)/g" \
                t/krb5.conf.in > t/krb5.conf
              PERL5LIB=blib/lib:blib/arch:Krb5Admin/blib/lib:Krb5Admin/blib/arch \
                prove t/curve25519.t t/getkdc.t t/getrealm.t t/systemd.t
            '
