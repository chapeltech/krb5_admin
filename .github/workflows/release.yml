name: Release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to backfill
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
  KNC_REPOSITORY: ChapelTech/knc
  KNC_RELEASE: v1.12
  KHARON_REPOSITORY: ChapelTech/kharon
  KHARON_RELEASE: v0.8.4
  PREFORK_REPOSITORY: ChapelTech/prefork
  PREFORK_RELEASE: v0.3

jobs:
  debian:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      DEB_ARCH: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}
      - name: Check release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          version=${RELEASE_TAG#v}
          debian_version=$(sed -n '1s/.*(\([^)]*\)).*/\1/p' debian/changelog)
          rpm_version=$(sed -n 's/^Version:[[:space:]]*//p' \
            packaging/rpm/libkrb5admin-perl.spec)
          test "$version" = "${debian_version%%-*}"
          test "$version" = "$rpm_version"
      - name: Download Debian dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          destination=$PWD/build/dependencies/debian
          mkdir -p "$destination"

          download_deb() {
            repository=$1
            release=$2
            package_name=$3
            pattern=$4
            temporary=$(mktemp -d)
            gh release download "$release" \
              --repo "$repository" \
              --pattern "$pattern" \
              --dir "$temporary"
            selected=
            selected_version=
            for candidate in "$temporary"/*.deb; do
              test "$(dpkg-deb -f "$candidate" Package)" = "$package_name"
              test "$(dpkg-deb -f "$candidate" Architecture)" = "$DEB_ARCH"
              candidate_version=$(dpkg-deb -f "$candidate" Version)
              if test -z "$selected" || \
                  dpkg --compare-versions "$candidate_version" gt "$selected_version"; then
                selected=$candidate
                selected_version=$candidate_version
              fi
            done
            test -n "$selected"
            mv "$selected" "$destination/"
            rm -rf "$temporary"
          }

          download_deb "$KNC_REPOSITORY" "$KNC_RELEASE" \
            knc "knc_*_${DEB_ARCH}.deb"
          download_deb "$KNC_REPOSITORY" "$KNC_RELEASE" \
            libknc "libknc_*_${DEB_ARCH}.deb"
          download_deb "$KHARON_REPOSITORY" "$KHARON_RELEASE" \
            libkharon-perl "libkharon-perl_*_${DEB_ARCH}.deb"
          download_deb "$PREFORK_REPOSITORY" "$PREFORK_RELEASE" \
            prefork "prefork_*_${DEB_ARCH}.deb"

          for package in "$destination"/*.deb; do
            dependencies=$(dpkg-deb -f "$package" Depends || true)
            if printf '%s\n' "$dependencies" | \
                grep -Eq '(^|[[:space:],])heimdal([[:space:],(]|$)'; then
              echo "$package depends on the non-distro heimdal package" >&2
              exit 1
            fi
          done
      - name: Build Debian packages
        run: |
          mkdir -p build/debian/source
          git archive HEAD | tar -x -C build/debian/source
          docker run --rm \
            -v "$PWD/build:/build" \
            -w /build/debian/source \
            debian:trixie-slim /bin/sh -euxc '
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                build-essential debhelper dh-autoreconf dpkg-dev file \
                heimdal-dev libdbd-sqlite3-perl libdbi-perl \
                perl sqlite3 swig
              apt-get install -y \
                /build/dependencies/debian/libkharon-perl_*.deb
              DEB_BUILD_OPTIONS="nocheck parallel=1" \
                dpkg-buildpackage --build=binary --no-sign
            '
          mkdir artifacts
          cp build/debian/*.deb artifacts/
      - name: Verify Debian client installation
        run: |
          docker run --rm \
            -v "$PWD/build:/build:ro" \
            debian:trixie-slim /bin/sh -euxc '
              apt-get update -qq
              package=$(find /build/debian -maxdepth 1 \
                -name "libkrb5admin-perl_*_$(dpkg --print-architecture).deb")
              apt-get install -y --no-install-recommends \
                /build/dependencies/debian/*.deb "$package"
              perl -MKrb5Admin::Client -e 1
              command -v krb5_admin
              command -v krb5_host
            '
      - uses: actions/upload-artifact@v4
        with:
          name: debian-packages-${{ matrix.architecture }}
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 1

  rpm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}
      - name: Check release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          version=${RELEASE_TAG#v}
          debian_version=$(sed -n '1s/.*(\([^)]*\)).*/\1/p' debian/changelog)
          rpm_version=$(sed -n 's/^Version:[[:space:]]*//p' \
            packaging/rpm/libkrb5admin-perl.spec)
          test "$version" = "${debian_version%%-*}"
          test "$version" = "$rpm_version"
      - name: Install RPM tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnupg rpm
      - name: Download EL9 dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          destination=$PWD/build/dependencies/rpm
          mkdir -p "$destination"

          download_rpm() {
            repository=$1
            release=$2
            package_name=$3
            pattern=$4
            temporary=$(mktemp -d)
            gh release download "$release" \
              --repo "$repository" \
              --pattern "$pattern" \
              --dir "$temporary"
            selected=$(find "$temporary" -maxdepth 1 -name '*.rpm' \
              -print | sort -V | tail -1)
            test -n "$selected"
            test "$(rpm -qp --qf '%{NAME}' "$selected")" = "$package_name"
            test "$(rpm -qp --qf '%{ARCH}' "$selected")" = x86_64
            mv "$selected" "$destination/"
            rm -rf "$temporary"
          }

          download_rpm "$KNC_REPOSITORY" "$KNC_RELEASE" \
            knc 'knc-[0-9]*.el9.x86_64.rpm'
          download_rpm "$KNC_REPOSITORY" "$KNC_RELEASE" \
            libknc 'libknc-[0-9]*.el9.x86_64.rpm'
          download_rpm "$KHARON_REPOSITORY" "$KHARON_RELEASE" \
            libkharon-perl 'libkharon-perl-[0-9]*.el9.x86_64.rpm'
          download_rpm "$PREFORK_REPOSITORY" "$PREFORK_RELEASE" \
            prefork 'prefork-[0-9]*.el9.x86_64.rpm'

          for package in "$destination"/*.rpm; do
            if rpm -qp --requires "$package" | grep -qx heimdal; then
              echo "$package depends on the non-distro heimdal package" >&2
              exit 1
            fi
          done
      - name: Build EL9 packages
        run: |
          mkdir -p build/rpm/SOURCES build/rpm/RPMS build/rpm/SRPMS
          version=$(sed -n 's/^Version:[[:space:]]*//p' \
            packaging/rpm/libkrb5admin-perl.spec)
          git archive --prefix="krb5_admin-$version/" HEAD | \
            gzip -n > "build/rpm/SOURCES/krb5_admin-$version.tar.gz"
          docker run --rm \
            -v "$PWD:/source:ro" \
            -v "$PWD/build:/build" \
            rockylinux:9 /bin/bash -euxc '
              dnf install -y dnf-plugins-core epel-release
              dnf config-manager --set-enabled crb
              dnf install -y \
                e2fsprogs-devel file gcc heimdal-devel make perl \
                perl-DBD-SQLite perl-DBI \
                perl-ExtUtils-MakeMaker perl-devel perl-generators \
                redhat-rpm-config rpm-build sqlite swig systemd-rpm-macros
              dnf install -y /build/dependencies/rpm/*.rpm
              rpmbuild -ba \
                --define "_topdir /build/rpm" \
                /source/packaging/rpm/libkrb5admin-perl.spec
            '
          mkdir artifacts
          cp build/rpm/RPMS/*/*.rpm artifacts/
          cp build/rpm/SRPMS/*.src.rpm artifacts/
      - name: Verify EL9 client installation
        run: |
          docker run --rm \
            -v "$PWD/build:/build:ro" \
            rockylinux:9 /bin/bash -euxc '
              dnf install -y dnf-plugins-core epel-release
              dnf config-manager --set-enabled crb
              package=$(find /build/rpm/RPMS -type f \
                -name "libkrb5admin-perl-[0-9]*.x86_64.rpm")
              dnf install -y /build/dependencies/rpm/*.rpm "$package"
              perl -MKrb5Admin::Client -e 1
              command -v krb5_admin
              command -v krb5_host
            '
      - name: Sign RPM packages
        env:
          ARCHIVE_SIGNING_KEY: ${{ secrets.ARCHIVE_SIGNING_KEY }}
          ARCHIVE_SIGNING_PASSPHRASE: ${{ secrets.ARCHIVE_SIGNING_PASSPHRASE }}
          ARCHIVE_SIGNING_FINGERPRINT: ${{ vars.ARCHIVE_SIGNING_FINGERPRINT }}
          GNUPGHOME: ${{ runner.temp }}/archive-signing
        run: |
          set -eu
          test -n "$ARCHIVE_SIGNING_KEY"
          test -n "$ARCHIVE_SIGNING_PASSPHRASE"
          test -n "$ARCHIVE_SIGNING_FINGERPRINT"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$ARCHIVE_SIGNING_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$ARCHIVE_SIGNING_FINGERPRINT!" \
            >/dev/null

          passphrase_file=$RUNNER_TEMP/archive-signing-passphrase
          public_key=$RUNNER_TEMP/archive-signing-key.asc
          rpmdb=$RUNNER_TEMP/rpmdb
          trap 'rm -f "$passphrase_file" "$public_key"; rm -rf "$GNUPGHOME" "$rpmdb"' EXIT
          umask 077
          printf '%s' "$ARCHIVE_SIGNING_PASSPHRASE" >"$passphrase_file"
          for package in artifacts/*.rpm; do
            rpmsign --addsign \
              --define "__gpg /usr/bin/gpg" \
              --define "_gpg_name $ARCHIVE_SIGNING_FINGERPRINT" \
              --define "_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback --passphrase-file $passphrase_file" \
              "$package"
          done

          gpg --batch --armor --export "$ARCHIVE_SIGNING_FINGERPRINT" \
            >"$public_key"
          mkdir -p "$rpmdb"
          rpm --dbpath "$rpmdb" --initdb
          rpm --dbpath "$rpmdb" --import "$public_key"
          for package in artifacts/*.rpm; do
            rpm --dbpath "$rpmdb" --checksig "$package" | \
              grep -q 'digests signatures OK$'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-packages
          path: artifacts/*.rpm
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [debian, rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
          --repo "$GITHUB_REPOSITORY"
      - name: Dispatch package repository publication
        env:
          GH_TOKEN: ${{ secrets.PKGS_DISPATCH_TOKEN }}
        run: |
          gh api --method POST repos/ChapelTech/pkgs/dispatches \
            -f event_type=package-release \
            -f "client_payload[repository]=$GITHUB_REPOSITORY" \
            -f "client_payload[tag]=$RELEASE_TAG"
